<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>
  </defs>

  <!-- ROBOT ICON EMBLEM (Centered in 320x320 canvas) -->
  <g transform="translate(10, 10)">
    <!-- Outer Track Belt (Rounded Oval) -->
    <rect x="35" y="55" width="230" height="190" rx="95" ry="95" 
          fill="none" stroke="url(#trackGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="35" y="55" width="230" height="190" rx="95" ry="95" 
          fill="none" stroke="#0F172A" stroke-width="10" opacity="0.4"/>

    <!-- Track Cleats / Treads (Top, Bottom, and Curves) -->
    <!-- Top cleats -->
    <line x1="85" y1="38" x2="85" y2="55" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="115" y1="35" x2="115" y2="52" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="34" x2="150" y2="51" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="185" y1="35" x2="185" y2="52" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="215" y1="38" x2="215" y2="55" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Bottom cleats -->
    <line x1="85" y1="245" x2="85" y2="262" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="115" y1="248" x2="115" y2="265" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="249" x2="150" y2="266" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="185" y1="248" x2="185" y2="265" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="215" y1="245" x2="215" y2="262" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Left / Right Curvature Cleats -->
    <line x1="18" y1="120" x2="35" y2="120" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="15" y1="150" x2="32" y2="150" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="18" y1="180" x2="35" y2="180" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>

    <line x1="265" y1="120" x2="282" y2="120" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="268" y1="150" x2="285" y2="150" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="265" y1="180" x2="282" y2="180" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Central Aluminum Chassis Plate -->
    <path d="M 95 105 L 205 105 L 225 150 L 205 195 L 95 195 L 75 150 Z" 
          fill="url(#bodyGrad)" stroke="#1E293B" stroke-width="4" stroke-linejoin="round"/>

    <!-- Left Sprocket / Wheel -->
    <circle cx="105" cy="150" r="35" fill="url(#wheelGrad)" stroke="url(#trackGrad)" stroke-width="5"/>
    <circle cx="105" cy="150" r="16" fill="url(#accentGrad)"/>
    <circle cx="105" cy="150" r="6" fill="#FFFFFF"/>

    <!-- Right Idler / Wheel -->
    <circle cx="195" cy="150" r="35" fill="url(#wheelGrad)" stroke="url(#trackGrad)" stroke-width="5"/>
    <circle cx="195" cy="150" r="16" fill="url(#accentGrad)"/>
    <circle cx="195" cy="150" r="6" fill="#FFFFFF"/>

    <!-- Central Tech Eye / Sensor Visor -->
    <path d="M 130 142 Q 150 130 170 142 Q 150 170 130 142 Z" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2"/>
    <ellipse cx="150" cy="148" rx="14" ry="7" fill="#00E5FF"/>
    <ellipse cx="150" cy="148" rx="6" ry="3" fill="#FFFFFF"/>
  </g>
</svg>